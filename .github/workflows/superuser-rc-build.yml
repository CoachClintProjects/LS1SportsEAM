name: Super User RC Build Gate

on:
  push:
    branches:
      - superuser-release-candidate
  workflow_dispatch:

concurrency:
  group: superuser-release-candidate-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact RC SHA
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies (mirror Vercel)
        run: npm install

      - name: Regression locks
        run: npm run verify:locks

      - name: Next production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
