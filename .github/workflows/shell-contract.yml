name: Protected Shell Contract
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protected LS1 shell
        run: node scripts/verify-shell-contract.mjs
